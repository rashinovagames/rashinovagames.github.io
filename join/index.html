<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a Ludo Yatra room</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #3a0c2c; color: #fff4dc; text-align: center; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 20px; }
  h1 { color: #ffc93c; font-size: 30px; margin: 0 0 8px; }
  .code { font-size: 56px; font-weight: 800; letter-spacing: 8px; color: #ffc93c; margin: 18px 0; }
  a.btn { display: inline-block; background: #2bb24c; color: #fff; text-decoration: none; font-weight: 700;
          padding: 16px 28px; border-radius: 14px; font-size: 20px; margin-top: 12px; }
  p { line-height: 1.5; }
  .small { font-size: 14px; opacity: .8; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>Ludo Yatra</h1>
  <p>Your friend is waiting in room</p>
  <div class="code" id="code">----</div>
  <a class="btn" id="open" href="https://play.google.com/store/apps/details?id=com.rashinova.jhoothludo">Open in Ludo Yatra</a>
  <p>No game yet? <a style="color:#ffc93c" href="https://play.google.com/store/apps/details?id=com.rashinova.jhoothludo">Get Ludo Yatra on Google Play</a>. When you open it, it joins this room by itself.</p>
  <p class="small">Or open the game, tap Play Online &gt; Play with Friends and type the code.</p>
</main>
<script>
  var m = /[?&]c=([A-Za-z0-9]{4})/.exec(location.search);
  var store = "https://play.google.com/store/apps/details?id=com.rashinova.jhoothludo";
  if (m) {
    var c = m[1].toUpperCase();
    document.getElementById("code").textContent = c;
    // the Play Store hands "room=CODE" to the game after installing, so the first open joins this room
    store += "&referrer=" + encodeURIComponent("room=" + c);
    var links = document.querySelectorAll("a[href^='https://play.google.com']");
    for (var i = 0; i < links.length; i++) links[i].href = store;
    if (/Android/i.test(navigator.userAgent)) {
      // the game if it is installed, otherwise straight to the Play Store
      var open = "intent://rashinovagames.github.io/join/?c=" + c +
        "#Intent;scheme=https;package=com.rashinova.jhoothludo;S.browser_fallback_url=" + encodeURIComponent(store) + ";end";
      document.getElementById("open").href = open;
      location.replace(open);
    }
  }
</script>
</body>
</html>
